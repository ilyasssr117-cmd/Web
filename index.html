<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JSON Studio</title>
  <style>
    :root {
      --bg-0: #070b14;
      --bg-1: #0d1424;
      --glass: rgba(18, 27, 48, 0.72);
      --glass-strong: rgba(24, 36, 64, 0.88);
      --border: rgba(148, 163, 184, 0.14);
      --border-glow: rgba(129, 140, 248, 0.42);
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #6366f1;
      --accent-2: #818cf8;
      --ok: #34d399;
      --err: #fb7185;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 28px 16px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background:
        radial-gradient(900px 500px at 85% -10%, rgba(99, 102, 241, 0.22), transparent 60%),
        radial-gradient(700px 450px at 10% 105%, rgba(56, 189, 248, 0.12), transparent 60%),
        linear-gradient(180deg, var(--bg-1), var(--bg-0));
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .shell {
      width: 100%;
      max-width: 720px;
      background: var(--glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 24px;
      box-shadow:
        0 24px 60px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
    }

    .title-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-2), #38bdf8);
      box-shadow: 0 0 14px rgba(129, 140, 248, 0.8);
    }

    h1 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .pill {
      font-size: 0.75rem;
      color: #c7d2fe;
      background: rgba(99, 102, 241, 0.14);
      border: 1px solid rgba(129, 140, 248, 0.28);
      padding: 5px 11px;
      border-radius: 999px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 160px;
      gap: 12px;
      margin-bottom: 14px;
    }

    @media (max-width: 560px) {
      .grid-2 {
        grid-template-columns: 1fr;
      }
      .shell {
        padding: 18px;
        border-radius: 18px;
      }
    }

    .field label {
      display: block;
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 6px;
      font-weight: 600;
    }

    input,
    textarea {
      width: 100%;
      background: var(--glass-strong);
      border: 1px solid var(--border);
      border-radius: 14px;
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.84rem;
      direction: ltr;
      text-align: left;
      transition: border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    }

    input {
      height: 44px;
      padding: 0 14px;
    }

    textarea {
      padding: 13px 14px;
      resize: vertical;
      line-height: 1.5;
    }

    #sessionBlob {
      min-height: 108px;
    }

    #result {
      min-height: 140px;
      margin-top: 14px;
      color: #e2e8f0;
    }

    #responseBox {
      min-height: 86px;
      margin-top: 10px;
      color: #cbd5e1;
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-color: var(--border-glow);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.16);
      background: rgba(29, 44, 78, 0.95);
    }

    .actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 16px;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      height: 42px;
      padding: 0 18px;
      border-radius: 12px;
      border: 1px solid transparent;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s ease, background 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #4f46e5);
      color: #fff;
      box-shadow: 0 8px 24px rgba(79, 70, 229, 0.35);
    }

    .btn-primary:hover:not(:disabled) {
      background: linear-gradient(135deg, var(--accent-2), var(--accent));
    }

    .btn-send {
      background: linear-gradient(135deg, #059669, #10b981);
      color: #fff;
      box-shadow: 0 8px 24px rgba(16, 185, 129, 0.28);
    }

    .btn-send:hover:not(:disabled) {
      background: linear-gradient(135deg, #10b981, #34d399);
    }

    .btn-ghost {
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
      border-color: var(--border);
    }

    .btn-ghost:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(148, 163, 184, 0.28);
    }

    .status {
      font-size: 0.82rem;
      color: var(--muted);
      font-weight: 600;
    }

    .status.ok {
      color: var(--ok);
    }

    .status.err {
      color: var(--err);
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="top">
      <div class="title-wrap">
        <span class="dot"></span>
        <h1>مولّد الجلسة</h1>
      </div>
      <span class="pill">Patient Arc • 120Hz</span>
    </div>

    <div class="grid-2">
      <div class="field">
        <label for="token">Token</label>
        <input id="token" type="text" placeholder="أدخل التوكن هنا..." />
      </div>
      <div class="field">
        <label for="target">Target Score</label>
        <input id="target" type="number" value="4600" min="1" />
      </div>
    </div>

    <div class="field">
      <label for="sessionBlob">بيانات الجلسة (JSON)</label>
      <textarea id="sessionBlob" placeholder='{"runId":"...","seed":...,"mode":"free","rules":"free"}'></textarea>
    </div>

    <div class="actions">
      <div class="btn-group">
        <button id="runBtn" class="btn-primary">توليد</button>
        <button id="runSendBtn" class="btn-send">توليد وإرسال</button>
        <button id="sendOnlyBtn" class="btn-ghost">إرسال</button>
        <button id="copyBtn" class="btn-ghost">نسخ</button>
      </div>
      <div id="status" class="status">جاهز</div>
    </div>

    <textarea id="result" readonly placeholder="النتيجة ستظهر هنا..."></textarea>
    <textarea id="responseBox" readonly placeholder="رد السيرفر (/api/finish) سيظهر هنا..."></textarea>
  </main>

  <script>
    const FINISH_URL = 'https://play.wacofficialbrand.com/api/finish';

    const SIM = (function () {
      const VERSION = 8, HZ = 120, W = 360, WALL = 6, TWO_PI = 6.283185307179586;
      const FLIGHT_MAX = 2 * HZ, MAX_MULT = 8;
      const RULES = {
        free: {},
        wild: { boost: 1, holes: 1, nocap: 1, tiers: 1, flips: 1 },
        wild2: { boost: 1, holes: 1, nocap: 1, tiers: 1, flips: 1, worm: 1 },
        upside: { upside: 1 }, holes: { holes: 1 }, nowalls: { wrap: 1 }, boost: { boost: 1 },
        nocap: { nocap: 1 }, fragile: { fragile: 1 }, drift: { drift: 1 }
      };
      const TWISTS = ['upside', 'holes', 'nowalls', 'boost', 'nocap', 'fragile', 'drift'];
      const TIER_AT = [0, 10, 20, 30];
      function rules(name, go, v) { const r = Object.assign({}, RULES[name] || RULES.free); if (go) r.go = 1; if (!RULES[name] || name === 'free') { if (!(v < 6)) r.reach = 1; if (v === 6) r.margin = 1; if (v === 7) r.big = 1; if (!(v < 8)) r.bigTo = 40; } return r; }

      function rnd(s) {
        s.rs = (s.rs + 0x6D2B79F5) | 0;
        let t = Math.imul(s.rs ^ (s.rs >>> 15), 1 | s.rs);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      }
      function lerp(a, b, t) { return a + (b - a) * t; }
      function diff(i) { const d = i / 70; return d > 1 ? 1 : d; }
      function clear(n, hx, hy, hr) {
        let dx = hx - n.x; if (dx < 0) dx = -dx; dx -= n.amp; if (dx < 0) dx = 0;
        const dy = hy - n.y, m = n.r + hr + 24;
        return dx * dx + dy * dy > m * m;
      }

      function addNode(s) {
        const i = s.nodes.length, R = s.R;
        const a = rnd(s), b = rnd(s), c = rnd(s), e = rnd(s), f = rnd(s), g = rnd(s);
        if (i === 0) { s.nodes.push({ i: 0, x: W / 2, y: 0, r: 40, type: 0, amp: 0, per: 1, off: 0, gone: false, flip: false }); return; }
        const p = s.nodes[i - 1], d = diff(i);
        const big = (R.big && s.score < 2000) || (R.bigTo && i < R.bigTo) ? 6 : 0;
        const r = lerp(40, 27, d) + a * 6 + big;
        let y = p.y + lerp(96, 136, d) + b * lerp(14, 38, d) + (big ? 8 : 0);
        if (p.type === 3) y = p.y + 240 + b * 70;
        const flip = !!R.flips && i % 25 === 20;
        let boost = false;
        if (R.boost && !flip && i >= 4 && p.type !== 3) boost = rnd(s) < 0.14;
        let type = 0, amp = 0, per = 1, off = 0;
        if (boost) type = 3;
        else if (flip) type = 0;
        else if ((i >= 10 && e < 0.10 + 0.20 * d) || (R.drift && i >= 2)) {
          type = 1; amp = lerp(20, 56, d) * (0.6 + 0.4 * f);
          per = Math.floor(lerp(3.8, 2.6, d) * HZ); off = Math.floor(g * per);
        } else if ((i >= 18 && e > 0.87 - 0.05 * d) || (R.fragile && i >= 3)) {
          type = 2;
        }
        const span = lerp(64, 150, d);
        let dx = (c * 2 - 1) * span;
        if (dx > -26 && dx < 26) dx = dx < 0 ? -26 : 26;
        let x = p.x + dx;
        const lo = r + amp + 14, hi = W - r - amp - 14;
        if (x < lo) x = lo + (lo - x) * 0.5;
        if (x > hi) x = hi - (x - hi) * 0.5;
        if (x < lo) x = lo;
        if (x > hi) x = hi;
        const n = { i: i, x: x, y: y, r: r, type: type, amp: amp, per: per, off: off, gone: false, flip: flip };
        s.nodes.push(n);
        let gapUsed = false;
        if (R.worm && s.wormWait.length && s.wormWait[0].exitAt <= i) {
          const hx0 = 30 + rnd(s) * (W - 60), hy = (p.y + n.y) * 0.5;
          let hx = hx0;
          if (!clear(p, hx, hy, 14) || !clear(n, hx, hy, 14)) hx = W - hx0;
          if (clear(p, hx, hy, 14) && clear(n, hx, hy, 14)) {
            const out = { x: hx, y: hy, r: 13, i: i, exit: true };
            s.holes.push(out); s.wormWait.shift().to = out; gapUsed = true;
          }
        }
        if (!gapUsed && R.holes && i >= 5 && rnd(s) < 0.22 + 0.28 * d) {
          const hr = 10 + rnd(s) * 5, hy = (p.y + n.y) * 0.5 + (rnd(s) - 0.5) * 24;
          let hx = hr + 12 + rnd(s) * (W - 2 * hr - 24);
          if (!clear(p, hx, hy, hr) || !clear(n, hx, hy, hr)) hx = W - hx;
          if (clear(p, hx, hy, hr) && clear(n, hx, hy, hr)) {
            const h = { x: hx, y: hy, r: hr, i: i };
            if (R.worm && rnd(s) < 0.4) { h.worm = true; h.exitAt = i + 3 + Math.floor(rnd(s) * 3); s.wormWait.push(h); }
            s.holes.push(h);
          }
        }
      }
      function ensure(s, yTop) { while (s.nodes[s.nodes.length - 1].y < yTop) addNode(s); }

      function nodeX(n, tick) {
        if (n.type !== 1) return n.x;
        const p = ((tick + n.off) % n.per) / n.per;
        const u = p < 0.5 ? p * 2 : 2 - p * 2;
        return n.x + n.amp * (2 * u * u * (3 - 2 * u) - 1);
      }

      function create(seed, R) {
        R = R || {};
        const s = {
          seed: seed >>> 0, rs: seed | 0, R: R, nodes: [], holes: [], hlo: 0, wormWait: [], tick: 0, t0: 0, started: false, dead: false, cause: '',
          score: 0, mult: 1, maxMult: 1, hops: 0, maxNode: 0, lo: 0,
          omega: 3.4, fspeed: 196,
          mode: 0, node: 0, rx: -40, ry: 0, dir: 1, swept: 0, lapped: false, quick: false,
          x: 0, y: 0, vx: 0, vy: 0, flight: 0, bounces: 0, from: 0, left: false,
          charge: 0, boost: 0, tier: 0, flipped: !!R.upside, wrap: !!R.wrap,
          deadline: -300, ev: []
        };
        addNode(s); ensure(s, 900);
        s.x = s.nodes[0].x + s.rx; s.y = s.nodes[0].y + s.ry;
        if (R.go) { s.started = true; s.t0 = 0; }
        return s;
      }

      function release(s, n, forced) {
        let sp = s.fspeed;
        s.boost = 0;
        if (n.type === 3) { s.boost = 1 + s.charge; sp = sp * (1.45 + 0.3 * s.charge); }
        const k = s.dir * sp / n.r;
        s.vx = -s.ry * k; s.vy = s.rx * k;
        s.mode = 1; s.flight = 0; s.bounces = 0; s.from = n.i; s.left = false;
        s.quick = !forced && (n.type === 3 || s.swept < TWO_PI);
        s.charge = 0;
        if (!s.started) { s.started = true; s.t0 = s.tick; }
        s.ev.push({ t: 'rel', boost: s.boost });
      }

      function capture(s, n, cx, dx, dy) {
        let d2 = dx * dx + dy * dy;
        if (d2 < 1e-6) { dx = n.r; dy = 0; d2 = dx * dx; }
        const k = n.r / Math.sqrt(d2);
        s.rx = dx * k; s.ry = dy * k;
        s.dir = (dx * s.vy - dy * s.vx) >= 0 ? 1 : -1;
        s.mode = 0; s.node = n.i; s.swept = 0; s.lapped = false; s.charge = 0;
        s.x = cx + s.rx; s.y = n.y + s.ry;
        if (n.i > s.maxNode) {
          const skipped = n.i - s.maxNode - 1, bank = s.bounces > 0, R = s.R;
          const cap = R.nocap ? 9999 : MAX_MULT, inc = s.tier >= 1 ? 2 : 1, prevTier = s.tier;
          s.mult = s.quick ? (s.mult + inc < cap ? s.mult + inc : cap) : 1;
          if (s.mult > s.maxMult) s.maxMult = s.mult;
          s.tier = R.tiers ? (s.mult >= TIER_AT[3] ? 3 : s.mult >= TIER_AT[2] ? 2 : s.mult >= TIER_AT[1] ? 1 : 0) : 0;
          let pts = (10 + 6 * skipped + (bank ? 10 : 0) + 20 * s.boost) * s.mult;
          if (bank && s.tier >= 2) pts = pts * 2;
          s.score += pts; s.maxNode = n.i; s.hops++;
          const d = diff(n.i);
          s.omega = lerp(3.4, 5.5, d); s.fspeed = lerp(196, 258, d);
          s.ev.push({ t: 'cap', pts: pts, skipped: skipped, bank: bank, mult: s.mult, boost: s.boost, tier: s.tier, up: s.tier > prevTier, down: s.tier < prevTier });
          if (n.flip) { s.flipped = !s.flipped; s.deadline -= 90; s.ev.push({ t: 'flip', up: !s.flipped }); }
        } else {
          s.mult = 1;
          if (s.tier) { s.tier = 0; s.ev.push({ t: 'tier', tier: 0 }); }
          s.ev.push({ t: 'back' });
        }
        s.boost = 0;
      }

      function die(s, cause) { s.dead = true; s.cause = cause; s.ev.push({ t: 'dead', cause: cause }); }

      function holes(s, dt) {
        while (s.hlo < s.holes.length && s.holes[s.hlo].y + 120 < s.deadline) s.hlo++;
        for (let i = s.hlo; i < s.holes.length; i++) {
          const h = s.holes[i], dy = h.y - s.y;
          if (dy > 120) break;
          if (dy < -120 || h.exit) continue;
          const dx = h.x - s.x, d2 = dx * dx + dy * dy, rr = h.r + 4;
          if (d2 < rr * rr) {
            if (!h.worm) { die(s, 'hole'); return; }
            let guard = 12;
            while (!h.to && guard-- > 0) addNode(s);
            if (!h.to) { die(s, 'hole'); return; }
            let sp = Math.sqrt(s.vx * s.vx + s.vy * s.vy); if (sp < s.fspeed) sp = s.fspeed; sp = sp * 1.15;
            const x0 = s.x, y0 = s.y;
            s.x = h.to.x; s.y = h.to.y + h.to.r + 6;
            s.vx = (s.vx < 0 ? -0.3 : 0.3) * sp; s.vy = 0.954 * sp;
            s.flight = 0; s.left = true;
            s.ev.push({ t: 'worm', x0: x0, y0: y0, x1: s.x, y1: s.y });
            return;
          }
          if (d2 < 110 * 110) { const a = 230000 / d2 * dt / Math.sqrt(d2); s.vx += dx * a; s.vy += dy * a; }
        }
      }

      function step(s, tap) {
        if (s.dead) return;
        const dt = 1 / HZ;
        if (s.mode === 0) {
          const n = s.nodes[s.node];
          if (tap) release(s, n, false);
          else {
            const om = n.type === 3 ? s.omega * (1 + 0.3 * s.charge) : s.omega;
            const t = s.dir * om * dt * 0.5, t2 = t * t;
            const c = (1 - t2) / (1 + t2), sn = 2 * t / (1 + t2);
            const nx = s.rx * c - s.ry * sn, ny = s.rx * sn + s.ry * c;
            const k = n.r / Math.sqrt(nx * nx + ny * ny);
            s.rx = nx * k; s.ry = ny * k;
            s.swept += om * dt;
            if (n.type === 3) {
              if (s.charge < 3 && s.swept >= TWO_PI * (s.charge + 1)) { s.charge++; s.ev.push({ t: 'charge', n: s.charge }); }
            } else if (!s.lapped && s.swept >= TWO_PI) {
              s.lapped = true;
              if (s.mult > 1) { s.mult = 1; s.ev.push({ t: 'lap' }); if (s.tier) { s.tier = 0; s.ev.push({ t: 'tier', tier: 0 }); } }
            }
            s.x = nodeX(n, s.tick) + s.rx; s.y = n.y + s.ry;
            if (n.type === 2 && s.swept >= TWO_PI * 1.2) { n.gone = true; s.ev.push({ t: 'pop' }); release(s, n, true); }
          }
        }
        if (s.mode === 1) {
          s.x += s.vx * dt; s.y += s.vy * dt;
          if (s.wrap || s.tier >= 3) {
            if (s.x < 0) { s.x += W; s.ev.push({ t: 'warp' }); }
            else if (s.x >= W) { s.x -= W; s.ev.push({ t: 'warp' }); }
          }
          else if (s.x < WALL) { s.x = 2 * WALL - s.x; s.vx = -s.vx; s.bounces++; s.ev.push({ t: 'wall' }); }
          else if (s.x > W - WALL) { s.x = 2 * (W - WALL) - s.x; s.vx = -s.vx; s.bounces++; s.ev.push({ t: 'wall' }); }
          s.flight++;
          if (s.holes.length) holes(s, dt);
          if (!s.dead) {
            if (!s.left) {
              const o = s.nodes[s.from], ox = s.x - nodeX(o, s.tick), oy = s.y - o.y, lim = o.r + 3;
              if (ox * ox + oy * oy > lim * lim) s.left = true;
            }
            ensure(s, s.y + 600);
            const hm0 = s.R.margin ? (s.score <= 1000 ? 10 : s.score >= 1700 ? 0 : 10 * (1700 - s.score) / 700) : 0;
            for (let i = s.lo; i < s.nodes.length; i++) {
              const n = s.nodes[i];
              if (n.y - n.r - hm0 > s.y) break;
              if (n.y + n.r + hm0 < s.y || n.gone) continue;
              if (i === s.from && !s.left) continue;
              const cx = nodeX(n, s.tick), dx = s.x - cx, dy = s.y - n.y, rr = n.r + (i === s.from ? 0 : hm0);
              if (dx * dx + dy * dy <= rr * rr) { capture(s, n, cx, dx, dy); break; }
            }
            if (s.mode === 1 && s.flight > (s.R.reach ? (s.mult >= 8 ? 384 : s.mult >= 4 ? 336 : s.mult >= 2 ? 312 : FLIGHT_MAX) : FLIGHT_MAX) * (s.boost ? 1.5 : 1)) die(s, 'lost');
          }
        }
        if (s.started) {
          const sec = (s.tick - s.t0) * dt;
          let rate = 26 + 0.8 * sec; if (rate > 110) rate = 110;
          s.deadline += rate * dt;
          const floor = s.nodes[s.maxNode].y - 340;
          if (s.deadline < floor) s.deadline = floor;
          while (s.lo < s.nodes.length - 1 && s.nodes[s.lo].y + 60 < s.deadline) s.lo++;
        }
        if (!s.dead && s.y < s.deadline) die(s, 'deadline');
        s.tick++;
      }

      function simulate(seed, taps, maxTicks, R) {
        const s = create(seed, R), lim = maxTicks || HZ * 60 * 30;
        let k = 0;
        while (!s.dead && s.tick < lim) {
          let tap = false;
          while (k < taps.length && taps[k] < s.tick) k++;
          if (k < taps.length && taps[k] === s.tick) { tap = true; k++; }
          step(s, tap);
          s.ev.length = 0;
          if (!s.started && k >= taps.length) break;
        }
        return { score: s.score, ticks: s.tick, dead: s.dead, cause: s.cause, hops: s.hops, maxMult: s.maxMult };
      }

      return { VERSION, HZ, W, TWO_PI, FLIGHT_MAX, MAX_MULT, RULES, TWISTS, TIER_AT, rules, create, step, simulate, nodeX, ensure };
    })();

    const KEY = 'sim_patient_up_miss_v3';
    const $ = id => document.getElementById(id);

    try {
      const saved = JSON.parse(localStorage.getItem(KEY) || '{}');
      if (saved.token) $('token').value = saved.token;
      if (saved.target) $('target').value = saved.target;
      if (saved.sessionBlob) $('sessionBlob').value = saved.sessionBlob;
    } catch (_) {}

    function save() {
      try {
        localStorage.setItem(KEY, JSON.stringify({
          token: $('token').value,
          target: $('target').value,
          sessionBlob: $('sessionBlob').value
        }));
      } catch (_) {}
    }

    ['token', 'target', 'sessionBlob'].forEach(id => $(id).addEventListener('input', save));

    function setStatus(text, type = '') {
      const el = $('status');
      el.textContent = text;
      el.className = 'status' + (type ? ' ' + type : '');
    }

    function parseBlob() {
      const raw = $('sessionBlob').value.trim();
      if (!raw) throw new Error('أدخل بيانات الجلسة');
      const data = JSON.parse(raw);
      const seedNum = Number(data.seed);
      if (data.seed === undefined || data.seed === null || !Number.isFinite(seedNum) || seedNum < 0) {
        throw new Error('Seed غير صالح');
      }
      if (!data.runId || typeof data.runId !== 'string') {
        throw new Error('Run ID غير صالح');
      }
      return {
        seed: seedNum >>> 0,
        runId: data.runId.trim(),
        mode: data.mode ? String(data.mode) : 'free',
        rulesName: data.rules ? String(data.rules) : 'free',
        token: $('token').value.trim(),
        target: Math.max(1, Math.floor(Number($('target').value) || 4600))
      };
    }

    function cloneState(obj) {
      if (typeof structuredClone === 'function') {
        try { return structuredClone(obj); } catch (_) {}
      }
      return JSON.parse(JSON.stringify(obj));
    }

    function mulberry32(a) {
      let t = a >>> 0;
      return function () {
        t += 0x6D2B79F5;
        let r = Math.imul(t ^ (t >>> 15), 1 | t);
        r ^= r + Math.imul(r ^ (r >>> 7), 61 | r);
        return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
      };
    }

    function hash32(str) {
      let h = 2166136261 >>> 0;
      for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return h >>> 0;
    }

    function makeFp(taps, hz, seed, runId) {
      const rng = mulberry32((seed ^ hash32(runId)) >>> 0);
      const r = (min, max) => min + rng() * (max - min);
      const minD = Math.round(r(42, 64));
      const maxD = Math.round(r(134, 190));
      let curX = r(255, 345);
      let curY = r(425, 515);
      const minX = 215, maxX = 395;
      const minY = 385, maxY = 565;
      const msPerTick = 1000 / hz;

      return taps.map((t, i) => {
        const next = i + 1 < taps.length ? taps[i + 1] : t + 185;
        const gapMs = Math.max(1, next - t) * msPerTick;
        const norm = Math.min(1, Math.max(0, (gapMs - 450) / 2200));
        const maxSafe = Math.max(25, Math.floor(gapMs * 0.72) - 12);
        const minSafe = Math.min(maxSafe, Math.max(28, minD - 10));
        let d = Math.round(minD + norm * (maxD - minD) + r(-16, 20));
        if (d > maxSafe) d = maxSafe;
        if (d < minSafe) d = minSafe;

        const stepMag = Math.min(22, 5 + norm * 14 + r(0, 7));
        const ang = r(0, Math.PI * 2);
        curX = Math.max(minX, Math.min(maxX, curX + Math.cos(ang) * stepMag));
        curY = Math.max(minY, Math.min(maxY, curY + Math.sin(ang) * stepMag));

        return ['t', d, Math.round(curX), Math.round(curY), 0];
      });
    }

    function solveTapsPatient(seed, runId, R, target) {
      const HZ = SIM.HZ, TWO_PI = SIM.TWO_PI, maxTicks = 120 * 60 * 5;
      const rng = mulberry32((seed ^ hash32(runId + ':patient-up-miss-v3')) >>> 0);

      function lapTicks(s) {
        const n = s.nodes[s.node];
        let om = s.omega;
        if (n && n.type === 3) om *= 1 + 0.3 * s.charge;
        return Math.max(24, Math.ceil(TWO_PI / om * HZ));
      }
      function winFor(s) {
        const n = s.nodes[s.node];
        let w = lapTicks(s) + 6;
        if (n && n.type === 2) w = Math.min(w, Math.floor(lapTicks(s) * 1.2) - 1);
        return w;
      }
      function maxFlight(s) {
        let f = SIM.FLIGHT_MAX;
        if (s.R && s.R.reach) f = s.mult >= 8 ? 384 : s.mult >= 4 ? 336 : s.mult >= 2 ? 312 : f;
        if (s.boost) f = Math.ceil(f * 1.5);
        return f + 12;
      }

      function flyOut(s, prevNode, prevScore) {
        let steps = 0, cap = maxFlight(s);
        while (!s.dead && s.mode === 1 && steps < cap && s.tick < maxTicks) {
          SIM.ensure(s, s.y + 800); SIM.step(s, false); s.ev.length = 0; steps++;
        }
        if (s.dead || (s.bounces || 0) > 0) return null;
        return (s.mode === 0 && s.node === prevNode + 1 && s.score > prevScore) ? s : null;
      }

      function dedupKey(s) {
        const b = Math.floor(((Math.atan2(s.ry, s.rx) + Math.PI) / TWO_PI) * 16) % 16;
        return s.node + '|' + s.mult + '|' + s.score + '|' + b;
      }

      function rank(item) {
        const s = item.state;
        return s.score * 10
          + s.maxNode * 25
          + Math.min(s.y - s.deadline, 1200) * 0.15
          + s.mult * 5;
      }

      function pickPatientCandidates(validList) {
        if (!validList.length) return [];
        const minIdx = validList.length > 4 ? Math.floor(validList.length * 0.25) : 0;
        const sub = validList.slice(minIdx);
        const ratio = 0.25 + rng() * 0.45;
        const idx = Math.min(sub.length - 1, Math.floor(sub.length * ratio));
        const picked = [sub[idx]];
        const idx2 = Math.min(sub.length - 1, Math.floor(sub.length * Math.min(0.92, ratio + 0.22)));
        if (idx2 !== idx) picked.push(sub[idx2]);
        return picked;
      }

      let beam = [{ state: SIM.create(seed, R), taps: [] }];
      let best = { score: 0, taps: [] };
      let targetItem = null;
      const startTime = Date.now();

      for (let d = 0; d < 320; d++) {
        const pool = new Map();
        let found = null;

        for (const item of beam) {
          if (item.state.score > best.score) best = { score: item.state.score, taps: item.taps.slice() };
          if (item.state.score >= target) { found = item; break; }
          if (item.state.dead || item.state.tick >= maxTicks) continue;

          const cur = cloneState(item.state);
          const prevNode = cur.node, prevScore = cur.score, win = winFor(cur), t0 = cur.tick;
          const validTapCands = [];

          for (let off = 0; off <= win; off++) {
            if (cur.dead || cur.mode !== 0 || cur.tick >= maxTicks) break;
            const tickNow = cur.tick;

            const br = cloneState(cur);
            SIM.ensure(br, br.y + 800); SIM.step(br, true); br.ev.length = 0;
            if (!br.dead && br.mode === 1) {
              const land = flyOut(br, prevNode, prevScore);
              if (land) validTapCands.push({ state: land, taps: item.taps.concat(tickNow) });
            } else if (!br.dead && (br.bounces || 0) === 0 && br.mode === 0 && br.node === prevNode + 1 && br.score > prevScore) {
              validTapCands.push({ state: br, taps: item.taps.concat(tickNow) });
            }

            SIM.ensure(cur, cur.y + 800); SIM.step(cur, false); cur.ev.length = 0;
            if (!cur.dead && cur.mode === 1) {
              const land = flyOut(cloneState(cur), prevNode, prevScore);
              if (land) {
                const cand = { state: land, taps: item.taps.slice() };
                const k = dedupKey(land);
                if (!pool.get(k) || rank(cand) > rank(pool.get(k))) pool.set(k, cand);
              }
              break;
            }
            if (cur.tick - t0 > win) break;
          }

          for (const cand of pickPatientCandidates(validTapCands)) {
            const k = dedupKey(cand.state);
            if (!pool.get(k) || rank(cand) > rank(pool.get(k))) pool.set(k, cand);
          }

          if (found || Date.now() - startTime > 30000) break;
        }

        if (found) { best = { score: found.state.score, taps: found.taps.slice() }; targetItem = found; break; }
        if (!pool.size || Date.now() - startTime > 30000) break;
        beam = [...pool.values()].sort((a, b) => rank(b) - rank(a)).slice(0, 28);
      }

      if (targetItem) {
        const cur = cloneState(targetItem.state), win = winFor(cur);
        const upDeadCands = [];
        const upAnyCands = [];

        for (let off = 0; off <= win * 2; off++) {
          if (cur.dead || cur.mode !== 0 || cur.tick >= maxTicks) break;
          const tickNow = cur.tick;

          const br = cloneState(cur);
          SIM.ensure(br, br.y + 800); SIM.step(br, true); br.ev.length = 0;
          const launchedUpward = br.mode === 1 && br.vy > 0;

          if (launchedUpward) {
            let st = 0, cap = Math.max(maxFlight(br) * 2, 480);
            while (!br.dead && br.mode === 1 && st < cap && br.tick < maxTicks) {
              SIM.ensure(br, br.y + 800); SIM.step(br, false); br.ev.length = 0; st++;
            }
            if ((br.bounces || 0) === 0 && br.score >= target) {
              const tCand = targetItem.taps.concat(tickNow);
              if (br.dead) upDeadCands.push(tCand);
              else upAnyCands.push(tCand);
            }
          }

          SIM.ensure(cur, cur.y + 800); SIM.step(cur, false); cur.ev.length = 0;
          if (cur.mode === 1) break;
        }

        const poolFinal = upDeadCands.length ? upDeadCands : upAnyCands;
        if (poolFinal.length) {
          const idx = Math.min(poolFinal.length - 1, Math.floor(poolFinal.length * (0.2 + rng() * 0.6)));
          const chosen = poolFinal[idx];
          if (SIM.simulate(seed, chosen, maxTicks, R).score >= target) {
            best.taps = chosen;
          }
        }
      }

      return best.taps;
    }

    function generatePayload() {
      save();
      const cfg = parseBlob();
      const ruleName = (cfg.rulesName && SIM.RULES[cfg.rulesName]) ? cfg.rulesName : cfg.mode;
      const R = SIM.rules(ruleName, false, SIM.VERSION);
      const taps = solveTapsPatient(cfg.seed, cfg.runId, R, cfg.target);
      const ver = SIM.simulate(cfg.seed, taps, 120 * 60 * 5, R);

      const body = {
        token: cfg.token,
        runId: cfg.runId,
        taps,
        score: ver.score,
        v: SIM.VERSION,
        group: '',
        fp: makeFp(taps, SIM.HZ, cfg.seed, cfg.runId)
      };

      $('result').value = JSON.stringify(body);
      setStatus(`Score: ${ver.score} · Taps: ${taps.length} · Hops: ${ver.hops}`, 'ok');
      return body;
    }

    async function sendFinishRequest(payloadObj) {
      const rawBody = payloadObj ? JSON.stringify(payloadObj) : $('result').value.trim();
      if (!rawBody) throw new Error('لا يوجد JSON لإرساله');
      JSON.parse(rawBody);

      $('responseBox').value = 'جاري الإرسال إلى ' + FINISH_URL + ' ...';
      const res = await fetch(FINISH_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Accept-Language': 'en-GB,en-US;q=0.9,en;q=0.8'
        },
        referrer: 'https://play.wacofficialbrand.com/?source=app',
        referrerPolicy: 'strict-origin-when-cross-origin',
        mode: 'cors',
        credentials: 'omit',
        body: rawBody
      });

      const text = await res.text();
      $('responseBox').value = `HTTP ${res.status} ${res.statusText}\n${text}`;
      if (res.ok) {
        setStatus(`تم الإرسال (${res.status})`, 'ok');
      } else {
        setStatus(`فشل الإرسال (${res.status})`, 'err');
      }
    }

    function setBusy(busy) {
      ['runBtn', 'runSendBtn', 'sendOnlyBtn', 'copyBtn'].forEach(id => {
        $(id).disabled = busy;
      });
    }

    $('runBtn').addEventListener('click', () => {
      try {
        generatePayload();
      } catch (err) {
        setStatus(err.message || 'خطأ', 'err');
      }
    });

    $('runSendBtn').addEventListener('click', async () => {
      setBusy(true);
      try {
        const body = generatePayload();
        await sendFinishRequest(body);
      } catch (err) {
        $('responseBox').value = String(err && err.stack ? err.stack : err);
        setStatus(err.message || 'خطأ أثناء التوليد أو الإرسال', 'err');
      } finally {
        setBusy(false);
      }
    });

    $('sendOnlyBtn').addEventListener('click', async () => {
      setBusy(true);
      try {
        await sendFinishRequest(null);
      } catch (err) {
        $('responseBox').value = String(err && err.stack ? err.stack : err);
        setStatus(err.message || 'خطأ أثناء الإرسال', 'err');
      } finally {
        setBusy(false);
      }
    });

    $('copyBtn').addEventListener('click', async () => {
      if (!$('result').value) return;
      try {
        await navigator.clipboard.writeText($('result').value);
      } catch (_) {
        $('result').select();
        document.execCommand('copy');
      }
      setStatus('تم النسخ', 'ok');
    });
  </script>
</body>
</html>
